name: c2inabox

services:

  # ── Adaptix C2: build server + extenders ─────────────────
  adaptix-build:
    profiles: ["build"]
    build:
      context: ${ADAPTIX_SRC:-./../AdaptixC2}
      target: build-server-ext
    container_name: c2inabox-adaptix-build
    volumes:
      - adaptix-dist:/server-dist
    command: >-
      sh -c "mkdir -p /server-dist &&
             cp /app/dist/adaptixserver /app/dist/ssl_gen.sh /app/dist/404page.html /server-dist/ &&
             cp -r /app/dist/extenders /server-dist/"

  # ── Adaptix C2: runtime ──────────────────────────────────
  adaptix:
    profiles: ["run"]
    build:
      context: ${ADAPTIX_SRC:-./../AdaptixC2}
      target: runtime
    container_name: c2inabox-adaptix
    ports:
      - "4321:4321"
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "8443:8443"
    volumes:
      - adaptix-dist:/app-dist:ro
      - adaptix-data:/app/data
      - ./config/profile.yaml:/app/profile.yaml:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        # Copy built artifacts into /app if not already there
        if [ ! -f /app/adaptixserver ]; then
          echo "[*] Copying built artifacts..."
          cp /app-dist/adaptixserver /app/ 2>/dev/null || true
          cp /app-dist/ssl_gen.sh /app/ 2>/dev/null || true
          cp /app-dist/404page.html /app/ 2>/dev/null || true
          cp -r /app-dist/extenders /app/ 2>/dev/null || true
        fi
        # Generate certs if missing
        if [ ! -f /app/server.rsa.crt ] || [ ! -f /app/server.rsa.key ]; then
          echo "[*] Generating self-signed certificates..."
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout /app/server.rsa.key -out /app/server.rsa.crt \
            -days 3650 -subj "/C=XX/ST=Lab/L=Lab/O=C2inaBox/CN=localhost"
        fi
        echo "[+] Starting Adaptix C2 Server..."
        exec /app/adaptixserver -profile /app/profile.yaml
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # ── Elasticsearch ────────────────────────────────────────
  elasticsearch:
    profiles: ["run"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: c2inabox-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-c2inabox-lab}
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-1g} -Xmx${ES_HEAP:-1g}
      - cluster.name=c2inabox
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTIC_PASSWORD:-c2inabox-lab} http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: ${ES_MEM_LIMIT:-3G}

  # ── ES setup (one-shot: set built-in user passwords) ─────
  es-setup:
    profiles: ["run"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: c2inabox-es-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-c2inabox-lab}
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD:-c2inabox-lab}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "[*] Setting kibana_system password..."
        curl -sf -X POST -u "elastic:$${ELASTIC_PASSWORD}" \
          -H "Content-Type: application/json" \
          http://elasticsearch:9200/_security/user/kibana_system/_password \
          -d "{\"password\": \"$${KIBANA_SYSTEM_PASSWORD}\"}"
        echo ""
        echo "[+] Setup complete"
    restart: "no"

  # ── Kibana ───────────────────────────────────────────────
  kibana:
    profiles: ["run"]
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: c2inabox-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD:-c2inabox-lab}
      - xpack.security.enabled=true
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=c2inabox-lab-encryption-key-32chars!
      - xpack.fleet.agents.fleet_server.hosts=["http://fleet-server:8220"]
      - xpack.fleet.outputs=[{id:"default-output",name:"default",type:"elasticsearch",hosts:["http://elasticsearch:9200"],is_default:true,is_default_monitoring:true}]
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  # ── SIEM setup (one-shot: policies, Elastic Defend, detection rules)
  siem-setup:
    profiles: ["run"]
    image: curlimages/curl:8.5.0
    container_name: c2inabox-siem-setup
    depends_on:
      kibana:
        condition: service_started
      es-setup:
        condition: service_completed_successfully
    environment:
      - KIBANA_URL=http://kibana:5601
      - ES_USER=elastic
      - ES_PASS=${ELASTIC_PASSWORD:-c2inabox-lab}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        AUTH="$${ES_USER}:$${ES_PASS}"

        echo "[*] Waiting for Kibana API..."
        until curl -sf -u "$$AUTH" "$$KIBANA_URL/api/status" > /dev/null 2>&1; do sleep 5; done
        echo "[+] Kibana is up"

        echo "[*] Creating Fleet Server policy..."
        curl -sf -X POST -u "$$AUTH" \
          -H "Content-Type: application/json" -H "kbn-xsrf: true" \
          "$$KIBANA_URL/api/fleet/agent_policies" \
          -d '{"id":"fleet-server-policy","name":"Fleet Server Policy","namespace":"default","has_fleet_server":true}' \
          > /dev/null 2>&1 || true

        echo "[*] Creating default agent policy..."
        curl -sf -X POST -u "$$AUTH" \
          -H "Content-Type: application/json" -H "kbn-xsrf: true" \
          "$$KIBANA_URL/api/fleet/agent_policies" \
          -d '{"id":"default-policy","name":"Default Policy","namespace":"default"}' \
          > /dev/null 2>&1 || true

        echo "[*] Installing Elastic Defend package..."
        curl -sf -X POST -u "$$AUTH" \
          -H "Content-Type: application/json" -H "kbn-xsrf: true" \
          "$$KIBANA_URL/api/fleet/epm/packages/endpoint/8.15.2" \
          > /dev/null 2>&1 || true

        echo "[*] Adding Elastic Defend integration (Detect mode)..."
        curl -sf -X POST -u "$$AUTH" \
          -H "Content-Type: application/json" -H "kbn-xsrf: true" \
          "$$KIBANA_URL/api/fleet/package_policies" \
          -d '{
            "name":"Elastic Defend",
            "namespace":"default",
            "policy_id":"default-policy",
            "package":{"name":"endpoint","version":"8.15.2"},
            "inputs":[{"type":"endpoint","enabled":true,"streams":[],
              "config":{"policy":{"value":{"windows":{
                "events":{"process":true,"network":true,"file":true,"registry":true,"security":true,"dll_and_driver_load":true,"dns":true},
                "malware":{"mode":"detect"},"ransomware":{"mode":"detect"},
                "memory_protection":{"mode":"detect"},"behavior_protection":{"mode":"detect"}
              }}}}}]
          }' > /dev/null 2>&1 || true

        echo "[*] Installing prebuilt detection rules (retries up to 60s)..."
        for i in 1 2 3 4 5 6; do
          if curl -sf -X PUT -u "$$AUTH" \
            -H "Content-Type: application/json" -H "kbn-xsrf: true" \
            -H "elastic-api-version: 2023-10-31" \
            "$$KIBANA_URL/api/detection_engine/rules/prepackaged" \
            > /dev/null 2>&1; then
            echo "[+] Prebuilt rules installed"
            break
          fi
          echo "  Retry $$i..."
          sleep 10
        done

        echo "[+] SIEM setup complete"
    restart: "no"

  # ── Fleet Server ─────────────────────────────────────────
  fleet-server:
    profiles: ["run"]
    image: docker.elastic.co/beats/elastic-agent:8.15.3
    container_name: c2inabox-fleet-server
    environment:
      - FLEET_SERVER_ENABLE=1
      - FLEET_SERVER_HOST=0.0.0.0
      - FLEET_SERVER_ELASTICSEARCH_HOST=http://elasticsearch:9200
      - FLEET_SERVER_SERVICE_TOKEN=${FLEET_SERVICE_TOKEN}
      - FLEET_SERVER_POLICY_ID=fleet-server-policy
      - FLEET_URL=http://fleet-server:8220
      - KIBANA_HOST=http://kibana:5601
      - KIBANA_FLEET_SETUP=1
      - KIBANA_FLEET_USERNAME=elastic
      - KIBANA_FLEET_PASSWORD=${ELASTIC_PASSWORD:-c2inabox-lab}
      - FLEET_SERVER_INSECURE_HTTP=true
    ports:
      - "${FLEET_PORT:-8220}:8220"
    depends_on:
      elasticsearch:
        condition: service_healthy
      es-setup:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  adaptix-dist:
    driver: local
  adaptix-data:
    driver: local
  es-data:
    driver: local
